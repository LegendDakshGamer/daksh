<!-- file: index.html
AI Reminder — Dial-based UI version (improved)

Features:
- Pick date and time from inputs
- Enter purpose separately
- Choose repeat (once, daily, every X hours)
- Stores reminders in localStorage
- Browser notifications at chosen times

Usage:
1. Save as index.html and open in Chrome/Edge/Brave
2. Allow notifications
3. Fill in date, time, purpose, repeat → Add Reminder
4. See upcoming reminders list, cancel if needed

Limitations:
- Works while browser is open (background tabs OK). Cross-device push needs Firebase/service worker.
-->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Reminder — Dial UI</title>
  <style>
    body{font-family:Inter,system-ui;background:linear-gradient(180deg,#0f1724 0%,#081428 100%);color:#e6eef8;margin:0;padding:20px}
    .container{max-width:700px;margin:0 auto}
    h1{text-align:center;margin-bottom:20px;font-size:24px}
    .card{background:rgba(255,255,255,0.05);padding:16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    input,select{flex:1;padding:10px;border-radius:8px;border:none;font-size:15px}
    input[type=date],input[type=time]{background:#1e293b;color:#fff}
    input[type=text]{background:#1e293b;color:#fff}
    select{background:#1e293b;color:#fff}
    button{background:#60a5fa;border:none;color:#03233b;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600}
    button.ghost{background:transparent;border:1px solid rgba(255,255,255,0.2);color:#9aa4b2}
    ul{list-style:none;padding:0;margin-top:16px}
    li{background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .meta{font-size:13px;color:#9aa4b2}
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Reminder</h1>
    <div class="card">
      <div class="row">
        <input id="date" type="date">
        <input id="time" type="time">
      </div>
      <div class="row">
        <input id="purpose" type="text" placeholder="Purpose (e.g. Drink water)">
      </div>
      <div class="row">
        <select id="repeat">
          <option value="none">Once</option>
          <option value="daily">Daily</option>
          <option value="every2h">Every 2 hours</option>
          <option value="every4h">Every 4 hours</option>
          <option value="every6h">Every 6 hours</option>
        </select>
      </div>
      <div class="row">
        <button id="add">Add Reminder</button>
        <button class="ghost" id="clearAll">Clear All</button>
      </div>
      <ul id="list"></ul>
    </div>
  </div>

  <script>
    const dateInput = document.getElementById('date')
    const timeInput = document.getElementById('time')
    const purposeInput = document.getElementById('purpose')
    const repeatInput = document.getElementById('repeat')
    const addBtn = document.getElementById('add')
    const clearAllBtn = document.getElementById('clearAll')
    const listEl = document.getElementById('list')

    let reminders = []
    let timers = {}

    function uid(){return Math.random().toString(36).slice(2,9)}
    function save(){ localStorage.setItem('reminders_v2', JSON.stringify(reminders)) }
    function load(){ reminders = JSON.parse(localStorage.getItem('reminders_v2')||'[]') }

    async function ensureNotifications(){
      if(!('Notification' in window)) return alert('Notifications not supported')
      if(Notification.permission==='default') await Notification.requestPermission()
    }

    function msToWhen(ms){ return new Date(ms).toLocaleString() }

    function schedule(rem){
      if(timers[rem.id]) clearTimeout(timers[rem.id])
      let now = Date.now(), delay = rem.time - now
      if(delay<0){
        if(rem.repeat==='daily') rem.time+=24*3600000
        else if(rem.repeat.startsWith('every')){
          let hours=parseInt(rem.repeat.replace(/\D/g,''))
          rem.time+=hours*3600000
        } else { rem.enabled=false; save(); render(); return }
        delay = rem.time-now
      }
      timers[rem.id] = setTimeout(()=>showReminder(rem), delay)
    }

    function showReminder(rem){
      if(Notification.permission==='granted') new Notification(rem.purpose,{body:rem.purpose,tag:rem.id})
      else alert(rem.purpose)

      if(rem.repeat==='daily') rem.time+=24*3600000
      else if(rem.repeat.startsWith('every')){
        let hours=parseInt(rem.repeat.replace(/\D/g,''))
        rem.time+=hours*3600000
      } else rem.enabled=false
      save(); render(); schedule(rem)
    }

    function render(){
      listEl.innerHTML=''
      reminders.filter(r=>r.enabled!==false).sort((a,b)=>a.time-b.time).forEach(r=>{
        const li=document.createElement('li')
        li.innerHTML=`<div>
          <div><strong>${r.purpose}</strong></div>
          <div class="meta">${msToWhen(r.time)} • ${r.repeat}</div>
        </div>
        <button class="ghost" onclick="cancelReminder('${r.id}')">Cancel</button>`
        listEl.appendChild(li)
      })
    }

    function cancelReminder(id){
      reminders=reminders.map(r=>r.id===id?{...r,enabled:false}:r)
      save(); render()
      if(timers[id]){clearTimeout(timers[id]); delete timers[id]}
    }

    addBtn.addEventListener('click',()=>{
      const date=dateInput.value,time=timeInput.value,purpose=purposeInput.value.trim(),repeat=repeatInput.value
      if(!date||!time||!purpose) return alert('Fill all fields')
      const [y,m,d]=date.split('-').map(Number)
      const [hh,mm]=time.split(':').map(Number)
      const dt=new Date(y,m-1,d,hh,mm,0,0)
      const rem={id:uid(),purpose,time:dt.getTime(),repeat,enabled:true}
      reminders.push(rem); save(); render(); schedule(rem)
      purposeInput.value=''
    })

    clearAllBtn.addEventListener('click',()=>{
      if(confirm('Clear all reminders?')){reminders=[];save();render();Object.values(timers).forEach(t=>clearTimeout(t));timers={}}
    })

    ;(async function init(){
      await ensureNotifications();
      load(); render();
      reminders.filter(r=>r.enabled!==false).forEach(schedule)
    })()

    window.cancelReminder=cancelReminder
  </script>
</body>
</html>
