<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AI Reminder</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b1020" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="top-card">
      <div class="logo">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden>
          <rect x="2" y="2" width="20" height="20" rx="4" fill="#0f1724"/>
          <path d="M7 14l3-3 3 3 5-5" stroke="#7c5cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="title">
        <h1>AI Reminder</h1>
        <p class="muted">Simple, modern reminders — runs fully in your browser</p>
      </div>
    </header>

    <section class="card form-card">
      <div class="form-grid">
        <label>
          <span>Purpose</span>
          <input id="purpose" type="text" placeholder="What do you want to remember?" maxlength="120" />
        </label>

        <label>
          <span>Date</span>
          <input id="date" type="date" />
        </label>

        <label>
          <span>Time</span>
          <input id="time" type="time" />
        </label>

        <label>
          <span>Repeat</span>
          <select id="repeat">
            <option value="once">Once</option>
            <option value="daily">Daily</option>
            <option value="2h">Every 2h</option>
            <option value="4h">Every 4h</option>
            <option value="6h">Every 6h</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="addBtn" class="primary">Add Reminder</button>
        <button id="requestPerm" class="ghost">Enable Notifications</button>
      </div>
      <p class="hint muted">Notifications require permission — you'll be asked once.</p>
    </section>

    <section class="card list-card">
      <h2>Upcoming Reminders</h2>
      <ul id="reminderList" class="reminder-list"></ul>
      <p id="empty" class="muted" style="text-align:center">No upcoming reminders — add one above ✨</p>
    </section>

    <footer class="foot muted">Made with 🔨🤖🔧 — installable PWA • Works offline</footer>
  </main>

  <template id="reminderItemTmpl">
    <li class="reminder">
      <div class="left">
        <div class="purpose"></div>
        <div class="meta muted"></div>
      </div>
      <div class="right">
        <div class="repeat muted small"></div>
        <div class="controls">
          <button class="cancel">Cancel</button>
        </div>
      </div>
    </li>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
